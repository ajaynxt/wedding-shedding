<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Royal Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="25%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#AA7A1E"/>
      <stop offset="75%" stop-color="#E6CA65"/>
      <stop offset="100%" stop-color="#8C6514"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6514"/>
      <stop offset="40%" stop-color="#E6CA65"/>
      <stop offset="60%" stop-color="#FFF4D0"/>
      <stop offset="100%" stop-color="#AA7A1E"/>
    </linearGradient>

    <radialGradient id="discBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F2EAE0"/>
    </radialGradient>

    <!-- Circular text paths -->
    <!-- Top arc: center 250,250, radius 208, from 215 deg to -35 deg -->
    <path id="topArc" d="M 80 250 A 170 170 0 1 1 420 250" fill="none"/>
    <!-- Bottom arc: center 250,250, radius 210, reversed for readable text -->
    <path id="bottomArc" d="M 80 250 A 170 170 0 0 0 420 250" fill="none"/>
    <path id="bottomArcReversed" d="M 416 260 A 166 166 0 0 1 84 260" fill="none"/>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="245" fill="url(#discBg)" stroke="url(#goldLinear)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="237" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Rings around text -->
  <circle cx="250" cy="250" r="142" fill="none" stroke="url(#goldLinear)" stroke-width="1.8"/>
  <circle cx="250" cy="250" r="136" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="2,3" opacity="0.7"/>

  <!-- Top Text: Brand Name -->
  <text font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif"
        font-size="24.5"
        font-weight="700"
        letter-spacing="5.5"
        fill="#1A1715"
        text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">
      WEDDING SHEDDING
    </textPath>
  </text>

  <!-- Bottom Text: Subtitle & Heritage -->
  <text font-family="'DM Sans', 'Inter', -apple-system, sans-serif"
        font-size="11.5"
        font-weight="600"
        letter-spacing="3.8"
        fill="#8C6514"
        text-anchor="middle">
    <textPath href="#bottomArcReversed" startOffset="50%">
      PVT. LTD. • ESTD 2015 • DELHI
    </textPath>
  </text>

  <!-- Left & Right Separator Diamonds -->
  <g fill="url(#goldLinear)">
    <!-- Left marker -->
    <polygon points="76,250 82,245 88,250 82,255"/>
    <circle cx="68" cy="250" r="2"/>
    <circle cx="96" cy="250" r="2"/>

    <!-- Right marker -->
    <polygon points="412,250 418,245 424,250 418,255"/>
    <circle cx="404" cy="250" r="2"/>
    <circle cx="432" cy="250" r="2"/>
  </g>

  <!-- Center Artwork: Luxury Camera Lens & Intertwined Wedding Rings Emblem -->
  <g transform="translate(250, 250)">
    <!-- Subtle center warm halo -->
    <circle cx="0" cy="0" r="115" fill="#FAF5ED" stroke="#EFE6D8" stroke-width="1"/>

    <!-- Camera Aperture 8 Blades Ring -->
    <g stroke="url(#goldLinear)" stroke-width="1.8" fill="none" opacity="0.85">
      <circle cx="0" cy="0" r="96" stroke-width="1.5" stroke-dasharray="4,4"/>
      <circle cx="0" cy="0" r="88" stroke-width="1"/>
      
      <!-- Aperture polygon lines -->
      <path d="M -25 -70 L 60 -45" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
      <path d="M 60 -45 L 70 30" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
      <path d="M 70 30 L 0 75" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
      <path d="M 0 75 L -65 40" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
      <path d="M -65 40 L -70 -25" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
      <path d="M -70 -25 L -25 -70" stroke="#AA7A1E" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- Two Interlocking Wedding Rings (Gold & Champagne) -->
    <g transform="translate(0, -6)">
      <!-- Ring 1 (Left) -->
      <ellipse cx="-22" cy="0" rx="36" ry="36" fill="none" stroke="url(#goldLinear)" stroke-width="5.5"/>
      <ellipse cx="-22" cy="0" rx="36" ry="36" fill="none" stroke="#FFF5D6" stroke-width="1" opacity="0.9"/>
      
      <!-- Diamond Solitaire on Ring 1 -->
      <g transform="translate(-22, -36)">
        <polygon points="0,-10 6,-3 0,4 -6,-3" fill="url(#goldShine)"/>
        <line x1="0" y1="-14" x2="0" y2="-18" stroke="#D4AF37" stroke-width="1.5"/>
        <line x1="-3" y1="-13" x2="-6" y2="-16" stroke="#D4AF37" stroke-width="1"/>
        <line x1="3" y1="-13" x2="6" y2="-16" stroke="#D4AF37" stroke-width="1"/>
      </g>

      <!-- Ring 2 (Right) -->
      <ellipse cx="22" cy="0" rx="36" ry="36" fill="none" stroke="url(#goldShine)" stroke-width="5.5"/>
      <ellipse cx="22" cy="0" rx="36" ry="36" fill="none" stroke="#AA7A1E" stroke-width="0.8" opacity="0.7"/>

      <!-- Interlocking Overlap Fix -->
      <path d="M 4 -22 A 36 36 0 0 1 14 0" fill="none" stroke="url(#goldLinear)" stroke-width="5.5"/>
    </g>

    <!-- Center Monogram 'W S' -->
    <g transform="translate(0, 4)">
      <!-- Backdrop glow for monogram -->
      <ellipse cx="0" cy="0" rx="30" ry="18" fill="#FAF6F0" opacity="0.85"/>
      
      <!-- Monogram Typography -->
      <text x="-12" y="11"
            font-family="'Cormorant Garamond', Georgia, serif"
            font-size="44"
            font-weight="700"
            font-style="italic"
            fill="#1A1715"
            text-anchor="middle">W</text>
      
      <text x="14" y="15"
            font-family="'Cormorant Garamond', Georgia, serif"
            font-size="46"
            font-weight="700"
            font-style="italic"
            fill="url(#goldLinear)"
            text-anchor="middle">S</text>
    </g>

    <!-- Shutter Focus Marks (North, South, East, West) -->
    <line x1="0" y1="-78" x2="0" y2="-86" stroke="#AA7A1E" stroke-width="1.5"/>
    <line x1="0" y1="78" x2="0" y2="86" stroke="#AA7A1E" stroke-width="1.5"/>
    <line x1="-78" y1="0" x2="-86" y2="0" stroke="#AA7A1E" stroke-width="1.5"/>
    <line x1="78" y1="0" x2="86" y2="0" stroke="#AA7A1E" stroke-width="1.5"/>

    <!-- Bottom Stars -->
    <g transform="translate(0, 52)" fill="url(#goldLinear)">
      <polygon points="0,-6 1.8,-1.8 6,-1.8 2.5,1 3.8,5.2 0,2.6 -3.8,5.2 -2.5,1 -6,-1.8 -1.8,-1.8" transform="scale(0.8)"/>
      <polygon points="0,-6 1.8,-1.8 6,-1.8 2.5,1 3.8,5.2 0,2.6 -3.8,5.2 -2.5,1 -6,-1.8 -1.8,-1.8" transform="translate(-16, 0) scale(0.6)"/>
      <polygon points="0,-6 1.8,-1.8 6,-1.8 2.5,1 3.8,5.2 0,2.6 -3.8,5.2 -2.5,1 -6,-1.8 -1.8,-1.8" transform="translate(16, 0) scale(0.6)"/>
    </g>
  </g>
</svg>
